# Dependabot version updates
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # ---- Maven dependencies & plugins ----
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    # Wait a few days after a release before proposing it (supply-chain safety)
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: scope
    groups:
      # vertx.version property + the Vert.x stack BOM move together
      vertx:
        patterns:
          - "io.vertx:*"
      junit:
        patterns:
          - "org.junit*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
      jdbc-drivers:
        patterns:
          - "com.mysql:*"
          - "com.h2database:*"

  # ---- GitHub Actions used in workflows ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
